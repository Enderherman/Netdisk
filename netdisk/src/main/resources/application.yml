server:
  port: ${NETDISK_PORT:7090}
  servlet:
    context-path: /api
    session:
      timeout: PT60M
      cookie:
        http-only: true
        same-site: lax
        secure: ${NETDISK_COOKIE_SECURE:false}
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  mail:
    host: ${NETDISK_MAIL_HOST:smtp.qq.com}
    port: ${NETDISK_MAIL_PORT:465}
    #自个的奥
    username: ${NETDISK_MAIL_USER:}
    password: ${NETDISK_MAIL_PASSWORD:}
    #######
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          socketFactory: javax.net.ssl.SSLSocketFactory
      debug: false
    protocol: smtps
  data:
    redis:
      database: ${NETDISK_REDIS_DB:0}
      host: ${NETDISK_REDIS_HOST:127.0.0.1}
      port: ${NETDISK_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10
          min-idle: 0
#查询生成的SQL语句
#mybatis:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

admin:
  email: ${NETDISK_ADMIN_EMAILS:}
netdisk:
  security:
    allowed-origins: ${NETDISK_ALLOWED_ORIGINS:}
# qq登陆相关
qq:
  app:
    id: ${NETDISK_QQ_APP_ID:}
    key: ${NETDISK_QQ_APP_KEY:}
  url:
    authorization: https://graph.qq.com/oauth2.0/authorize?response_type=code&client_id=%s&redirect_uri=%s&state=%s
    access:
      token: https://graph.qq.com/oauth2.0/token?grant_type=authorization_code&client_id=%s&client_secret=%s&code=%s&redirect_uri=%s
    openid: https://graph.qq.com/oauth2.0/me?access_token=%S
    user:
      info: https://graph.qq.com/user/get_user_info?access_token=%s&oauth_consumer_key=%s&openid=%s
    redirect: ${NETDISK_QQ_REDIRECT:}
