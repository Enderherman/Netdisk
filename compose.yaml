name: ${COMPOSE_PROJECT_NAME:-netdisk}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: netdisk
      MYSQL_USER: netdisk
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.compose}
      TZ: ${NETDISK_TIMEZONE:-Asia/Shanghai}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./sql/init.sql
        target: /opt/netdisk-schema/init.sql
        read_only: true
      - type: bind
        source: ./scripts/mysql/010-schema.sh
        target: /docker-entrypoint-initdb.d/010-schema.sh
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP --host=127.0.0.1 --user=netdisk --database=netdisk --batch --skip-column-names --execute='SELECT 1 FROM user_info LIMIT 0' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks: [data]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.compose}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [data]

  backend:
    image: ${NETDISK_BACKEND_IMAGE:-netdisk-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${NETDISK_UID:-10001}
        APP_GID: ${NETDISK_GID:-10001}
    user: "${NETDISK_UID:-10001}:${NETDISK_GID:-10001}"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      NETDISK_PORT: "7090"
      NETDISK_STORAGE: /data/netdisk/
      NETDISK_DB_URL: jdbc:mysql://mysql:3306/netdisk?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=DISABLED
      NETDISK_DB_USER: netdisk
      NETDISK_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.compose}
      NETDISK_REDIS_HOST: redis
      NETDISK_REDIS_PORT: "6379"
      NETDISK_REDIS_DB: "0"
      NETDISK_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.compose}
      NETDISK_ADMIN_EMAILS: ${NETDISK_ADMIN_EMAILS:-}
      NETDISK_ALLOWED_ORIGINS: ${NETDISK_ALLOWED_ORIGINS:-http://127.0.0.1:8080}
      NETDISK_COOKIE_SECURE: ${NETDISK_COOKIE_SECURE:-false}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 100MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 110MB
      NETDISK_MAIL_HOST: ${NETDISK_MAIL_HOST:-smtp.qq.com}
      NETDISK_MAIL_PORT: ${NETDISK_MAIL_PORT:-465}
      NETDISK_MAIL_USER: ${NETDISK_MAIL_USER:-}
      NETDISK_MAIL_PASSWORD: ${NETDISK_MAIL_PASSWORD:-}
      NETDISK_MAIL_CONNECT_TIMEOUT_MS: ${NETDISK_MAIL_CONNECT_TIMEOUT_MS:-5000}
      NETDISK_MAIL_READ_TIMEOUT_MS: ${NETDISK_MAIL_READ_TIMEOUT_MS:-10000}
      NETDISK_MAIL_WRITE_TIMEOUT_MS: ${NETDISK_MAIL_WRITE_TIMEOUT_MS:-10000}
      NETDISK_QQ_ENABLED: ${NETDISK_QQ_ENABLED:-false}
      NETDISK_QQ_APP_ID: ${NETDISK_QQ_APP_ID:-}
      NETDISK_QQ_APP_KEY: ${NETDISK_QQ_APP_KEY:-}
      NETDISK_QQ_REDIRECT: ${NETDISK_QQ_REDIRECT:-}
      NETDISK_UPLOAD_TASK_TTL_HOURS: ${NETDISK_UPLOAD_TASK_TTL_HOURS:-24}
      NETDISK_UPLOAD_RECEIPT_TTL_HOURS: ${NETDISK_UPLOAD_RECEIPT_TTL_HOURS:-168}
      NETDISK_UPLOAD_CLEANUP_ENABLED: ${NETDISK_UPLOAD_CLEANUP_ENABLED:-true}
      NETDISK_RECYCLE_RETENTION_DAYS: ${NETDISK_RECYCLE_RETENTION_DAYS:-30}
      TZ: ${NETDISK_TIMEZONE:-Asia/Shanghai}
    volumes:
      - files-data:/data/netdisk
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    stop_grace_period: 60s
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [app, data]

  frontend:
    image: ${NETDISK_FRONTEND_IMAGE:-netdisk-web:local}
    build:
      context: ${NETDISK_WEB_CONTEXT:-../NetdiskWeb}
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "${NETDISK_BIND_ADDRESS:-127.0.0.1}:${NETDISK_HTTP_PORT:-8080}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    depends_on:
      backend: { condition: service_healthy }
    networks: [app]

volumes:
  mysql-data:
  redis-data:
  files-data:

networks:
  app:
  data:
    internal: true
